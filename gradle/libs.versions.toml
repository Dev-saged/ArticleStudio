[versions]
agp = "8.11.1"
kotlin = "2.2.0"
ksp = "2.2.0-2.0.2"
hilt = "2.57"
composeBom = "2025.07.00"
room = "2.7.2"
navigation = "2.9.2"
coroutines = "1.10.2"
serialization = "1.9.0"
lifecycle = "2.9.2"
activity = "1.10.1"
